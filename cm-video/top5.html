<!doctype html>
<html><head><meta charset="utf-8">
<!-- Plantilla "Top 5" vertical 1080x1920. Se rellena con setData(data) y se pinta con render(t). -->
<style>
@font-face{font-family:I;font-weight:600;src:url(fonts/inter-latin-600-normal.woff2)}
@font-face{font-family:I;font-weight:800;src:url(fonts/inter-latin-800-normal.woff2)}
@font-face{font-family:I;font-weight:900;src:url(fonts/inter-latin-900-normal.woff2)}
:root{--acc:#c6ff3d;--acc2:#ff2d8a}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:#09090e;overflow:hidden;font-family:I,sans-serif;color:#fff}
#stage{position:absolute;inset:0;overflow:hidden}
.bg{position:absolute;left:-200px;top:-200px;width:1480px;height:2320px;object-fit:cover;filter:blur(46px) saturate(1.5) brightness(.55);opacity:0}
#shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(9,9,14,.55),rgba(9,9,14,.15) 40%,rgba(9,9,14,.85))}
#grain{position:absolute;inset:-100px;background:url(grain.png);opacity:.07;mix-blend-mode:overlay;z-index:50}
.num{position:absolute;left:30px;top:70px;font-size:760px;font-weight:900;line-height:.8;letter-spacing:-.06em;color:transparent;-webkit-text-stroke:5px var(--acc);opacity:0;white-space:nowrap}
.card{position:absolute;left:50%;top:340px;width:640px;margin-left:-320px;border-radius:30px;overflow:hidden;box-shadow:0 50px 110px rgba(0,0,0,.75),0 0 0 2px rgba(255,255,255,.14);opacity:0}
.card img{display:block;width:100%;height:900px;object-fit:cover}
.card .sheen{position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);mix-blend-mode:overlay}
.info{position:absolute;left:70px;width:940px;top:1300px;opacity:0}
.ttl{font-size:70px;font-weight:900;letter-spacing:-.03em;line-height:1.02}
.meta{display:flex;flex-wrap:wrap;gap:16px;margin-top:22px;align-items:center}
.chip{padding:12px 26px;border-radius:999px;background:rgba(255,255,255,.16);font-size:32px;font-weight:800}
.score{padding:12px 28px;border-radius:999px;background:var(--acc);color:#0f0f14;font-size:40px;font-weight:900;box-shadow:5px 6px 0 rgba(0,0,0,.45)}
.ln{position:absolute;left:84px;overflow:hidden;line-height:.95;font-weight:900;letter-spacing:-.04em;white-space:nowrap}
.ln>span{display:block;opacity:0}
#cta{position:absolute;left:84px;top:1000px;height:128px;padding:0 64px;border-radius:999px;background:var(--acc2);font-size:54px;font-weight:800;line-height:128px;box-shadow:8px 10px 0 rgba(0,0,0,.45);letter-spacing:-.02em;opacity:0;transform-origin:0 50%}
#url{position:absolute;left:0;width:1080px;top:1190px;text-align:center;font-size:50px;font-weight:800;color:#c9c9d6;opacity:0}
#flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:40}
.sp{position:absolute;width:14px;height:14px;border-radius:50%;opacity:0}
body.land .card{width:940px;margin-left:-470px;top:600px}
body.land .card img{height:529px}
body.land .info{top:1240px}
</style></head><body>
<div id="stage">
 <div id="bgs"></div><div id="shade"></div>
 <div id="nums"></div><div id="cards"></div><div id="infos"></div><div id="sps"></div>
 <div class="ln" id="t1" style="top:560px;font-size:330px"><span>TOP 5</span></div>
 <div class="ln" id="t2" style="top:900px;font-size:168px;color:var(--acc)"><span></span></div>
 <div class="ln" id="t3" style="top:1130px;font-size:62px;font-weight:600;letter-spacing:-.02em;color:#c9c9d6"><span></span></div>
 <div class="ln" id="e1" style="top:380px;font-size:142px"><span></span></div>
 <div class="ln" id="e2" style="top:520px;font-size:142px"><span style="color:var(--acc)"></span></div>
 <div class="ln" id="e3" style="top:660px;font-size:142px"><span></span></div>
 <div id="cta"></div>
 <div id="url"></div>
 <div class="ln" id="logo" style="left:0;width:1080px;top:1560px;font-size:120px;text-align:center;font-weight:800"><span>kultura<b style="color:var(--acc2)">.</b></span></div>
 <div id="flash"></div><div id="grain"></div>
</div>
<script>
// Tiempos (s). La música usa los mismos cues (render.py los exporta).
const T0=[2.4,5.3,8.2,11.1,14.0], DUR=[2.9,2.9,2.9,2.9,4.6], END=18.9, TOTAL=21.5;
window.TIMING={T0,DUR,END,TOTAL};
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eo=x=>1-Math.pow(1-clamp(x),4);
const eb=x=>{x=clamp(x);const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D=null;const bgs=[],cards=[],nums=[],infos=[],sps=[];
window.setData=function(d){
 D=d; // d.items: [{rank,title,score,genres,img}] ordenados 5→1
 if(d.accent)document.documentElement.style.setProperty('--acc',d.accent);
 if(d.accent2)document.documentElement.style.setProperty('--acc2',d.accent2);
 $('t1').firstElementChild.textContent=d.intro[0];
 $('t2').firstElementChild.textContent=d.intro[1];
 $('t3').firstElementChild.textContent=d.intro[2];
 if(d.landscape)document.body.classList.add('land');
 if(d.intro[1].length>9)$('t2').style.fontSize=Math.floor(168*9/d.intro[1].length)+'px';
 ['e1','e2','e3'].forEach((id,k)=>$(id).firstElementChild.textContent=d.outro[k]);
 const longest=Math.max(...d.outro.map(s=>s.length));if(longest>12)['e1','e2','e3'].forEach(id=>$(id).style.fontSize=Math.floor(142*12/longest)+'px');
 $('cta').textContent=d.cta;$('url').textContent=d.url;
 d.items.forEach((it,i)=>{
  const b=document.createElement('img');b.className='bg';b.src=it.img;$('bgs').appendChild(b);bgs.push(b);
  const n=document.createElement('div');n.className='num';n.textContent=it.rank;$('nums').appendChild(n);nums.push(n);
  const c=document.createElement('div');c.className='card';c.innerHTML='<img src="'+esc(it.img)+'"><div class="sheen"></div>';$('cards').appendChild(c);cards.push(c);
  const f=document.createElement('div');f.className='info';
  const fs=it.title.length>48?50:it.title.length>32?58:70;
  f.innerHTML='<div class="ttl" style="font-size:'+fs+'px">'+esc(it.title)+'</div><div class="meta">'+(it.score?'<span class="score">★ <span class="sv">0.0</span></span>':'')+(it.genres||[]).slice(0,3).map(x=>'<span class="chip">'+esc(x)+'</span>').join('')+'</div>';
  $('infos').appendChild(f);infos.push(f);
 });
 for(let i=0;i<40;i++){const s=document.createElement('div');s.className='sp';s.style.background=i%3?'var(--acc)':'var(--acc2)';$('sps').appendChild(s);sps.push(s)}
};
function line(id,t,a,b){const e=$(id).firstElementChild;if(t<a||t>=b){e.style.opacity=0;return}e.style.opacity=1;e.style.transform='translateY('+(1-eo((t-a)/.7))*110+'%)'}
window.render=function(t){
 if(!D)return;
 line('t1',t,.2,2.3);line('t2',t,.55,2.3);line('t3',t,1.0,2.3);
 let flash=0;const last=D.items.length-1;
 D.items.forEach((d,i)=>{
  const a=T0[i],e=a+DUR[i],lt=t-a,bg=bgs[i],cd=cards[i],nm=nums[i],inf=infos[i];
  const vis=t>=a-.05&&t<e+.5&&t<END;
  if(!vis){bg.style.opacity=0;cd.style.opacity=0;nm.style.opacity=0;inf.style.opacity=0;return}
  const out=i===last?clamp((t-(END-.3))/.3):clamp((t-e)/.5),big=i===last;
  bg.style.opacity=(clamp(lt/.4)*(1-out)).toFixed(3);
  bg.style.transform='scale('+(1+lt*(big?.035:.02))+')';
  const np=eb(lt/.7);
  nm.style.opacity=(clamp(lt/.25)*(1-out)*.95).toFixed(3);
  nm.style.transform='translate('+(-80*(1-eo(lt/.7))-lt*6)+'px,'+(1-np)*-120+'px) scale('+(.85+.15*np)+')';
  const rot=(1-eo(lt/.9))*-38+Math.sin(t*1.3+i)*1.8;
  const ty=(1-eb(lt/.8))*1100-(big?0:out*1300);
  const sc=big?1+.05*eo((lt-.3)/1.5):1+Math.min(lt,2.9)*.008;
  cd.style.opacity=lt<0?0:(big?1-out:1);
  cd.style.transform='perspective(1800px) translateY('+ty+'px) rotateY('+rot+'deg) rotateX('+((1-eo(lt/.9))*14)+'deg) scale('+sc+')';
  cd.querySelector('.sheen').style.transform='translateX('+((lt-.4)*160-80)+'%)';
  const ip=eo((lt-.35)/.6);
  inf.style.opacity=(ip*(1-out)).toFixed(3);
  inf.style.transform='translateY('+(1-ip)*70+'px)';
  const sv=inf.querySelector('.sv');if(sv)sv.textContent=(d.score*eo((lt-.5)/1.1)).toFixed(1);
  if(lt>=0&&lt<.12)flash=Math.max(flash,.35*(1-lt/.12));
  if(big&&lt>=.5&&lt<.65)flash=Math.max(flash,.18*(1-(lt-.5)/.15));
 });
 $('flash').style.opacity=flash;
 const lt1=t-T0[last];
 sps.forEach((s,k)=>{
  if(lt1<.6||lt1>4.6){s.style.opacity=0;return}
  const u=lt1-.6,ang=k*2.399,r=(300+(k%7)*90)*eo(u/1.6);
  s.style.opacity=(clamp(1-u/2.2)*.9).toFixed(3);
  s.style.transform='translate('+(540+Math.cos(ang)*r)+'px,'+(760+Math.sin(ang)*r+u*u*130)+'px) scale('+(1.4-u*.4)+')';
 });
 const ep=t-END;
 ['e1','e2','e3'].forEach((id,k)=>{const el=$(id).firstElementChild;if(t<END){el.style.opacity=0;return}el.style.opacity=1;el.style.transform='translateY('+(1-eo((ep-k*.12)/.6))*110+'%)'});
 $('cta').style.opacity=ep>.7?1:0;$('cta').style.transform='scale('+(ep>.7?eb((ep-.7)/.7):0)+')';
 $('url').style.opacity=ep>1.1?eo((ep-1.1)/.5):0;
 const lg=$('logo').firstElementChild;lg.style.opacity=ep>.3?eo((ep-.3)/.6):0;
};
</script></body></html>
