name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Integración contra el proyecto Supabase de TEST: en los PR que tocan
  # migraciones o la API, a mano (Actions → CI → Run workflow) y cada lunes
  # para detectar deriva.
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

# Imagen fija: `ubuntu-latest` pasó a 26.04 (9/11/2026) y Playwright aún no
# tiene Chromium para ella. Subir cuando Playwright la soporte.
jobs:
  build:
    name: Lint, typecheck, test, build
    # El cron semanal solo existe para la suite de integración.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04

    env:
      # Placeholders para que `next build` no pete por env vars ausentes.
      # No son secretos reales — solo desbloquean el build estático.
      # Si en el futuro necesitamos secrets reales en CI, se sustituyen por ${{ secrets.* }}.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder_anon_key
      SUPABASE_SERVICE_ROLE_KEY: placeholder_service_role_key
      TMDB_API_KEY: placeholder_tmdb
      RAWG_API_KEY: placeholder_rawg
      COMICVINE_KEY: placeholder_comicvine
      # Con el prefijo real: la portada y los legales se pintan en el build
      # (D-02) y leen `env.server.ts`, que valida el formato.
      ANTHROPIC_API_KEY: sk-ant-placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # SEG-4: ninguna vulnerabilidad alta o crítica en las dependencias que
      # llegan a producción (las de desarrollo no se despliegan).
      - name: Audit (producción)
        run: npm audit --omit=dev --audit-level=high

      # Saneamiento 2.12: una migración nueva con fecha anterior a la última
      # de master se quedaría sin aplicar en producción.
      - name: Orden de las migraciones
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "$GITHUB_BASE_REF"
          node scripts/check-migration-order.mjs FETCH_HEAD

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run type-check

      # Criterio DIS (1): ninguna clase de `src` sin regla compilada, y los
      # sets cerrados de radios, tipos, sombras y retícula (F-30). También
      # corren dentro de `npm test`; aquí van aparte para que el fallo se lea
      # solo en el resumen del job.
      - name: Sistema de diseño (clases sin regla y sets cerrados)
        run: npx vitest run tests/unit/visual tests/unit/design

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  a11y:
    name: Accesibilidad (axe, teclado, reflow y diálogos)
    # Red de seguridad ACC-18: falla con cualquier violación `serious` o
    # `critical` de axe (WCAG 2.2 A/AA) en las páginas públicas y en la app con
    # sesión, si un diálogo deja escapar el foco o no lo devuelve, si algo
    # desborda a 320 px o si una parada de Tab no se ve.
    # No depende de nadie: Supabase simulado en localhost
    # (tests/e2e/a11y/mock-supabase.cjs) y `fetch` del servidor sin red
    # (offline-fetch.cjs); el navegador solo puede hablar con localhost.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Chromium de Playwright en caché, con la versión instalada como clave:
      # solo se descarga (con sus dependencias de sistema) cuando cambia.
      # En acierto no hace falta `--with-deps`: la imagen ubuntu-latest ya
      # trae Google Chrome y, con él, las librerías que necesita Chromium.
      - name: Versión de Playwright
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Caché de navegadores de Playwright
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Navegador de Playwright (descarga)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Navegador de Playwright (desde la caché)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install chromium

      - name: Build con Supabase simulado y sin red
        run: npm run test:a11y:build

      - name: axe, teclado, reflow y diálogos (390 y 1440 px)
        run: npm run test:a11y

      - name: Informe de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: |
            playwright-report/a11y
            test-results/a11y
          retention-days: 14

  lighthouse:
    name: Rendimiento (Lighthouse CI con presupuesto)
    # REN (criterio 6, F-22): falla el PR si el JS inicial de la portada, un
    # ranking o un legal pasa de 150 KB transferidos o su CLS de 0,05 (ver
    # lighthouserc.json y tests/unit/csp/lighthouse-budget.test.ts; el tope
    # provisional de 160 KB de la portada se retiró en F-30). Mismo entorno que el job de accesibilidad (Supabase simulado y sin
    # red): mide el código, no a los proveedores. LCP y TBT avisan sin fallar
    # (en un runner compartido varían demasiado para cortar).
    # Ojo: `next start` sirve gzip y Vercel brotli (≈ 10-15 % menos): en
    # producción el margen es mayor que el que se ve aquí.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build con Supabase simulado y sin red
        run: npm run test:a11y:build

      - name: Arrancar la app (Supabase simulado + next start)
        run: |
          node tests/e2e/a11y/mock-supabase.cjs &
          node -e '
            const { A11Y_ENV, A11Y_PORT } = require("./tests/e2e/a11y/env.cjs");
            const { spawn } = require("node:child_process");
            spawn("npx", ["next", "start", "-p", String(A11Y_PORT)], {
              env: { ...process.env, ...A11Y_ENV }, stdio: "inherit", detached: true,
            }).unref();
          '
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3187/es/privacy && exit 0
            sleep 1
          done
          echo "next start no respondió en 60 s" && exit 1

      - name: Lighthouse CI (lighthouserc.json)
        run: npx --yes @lhci/cli@0.15.1 autorun

      - name: Informes de Lighthouse
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: test-results/lhci
          retention-days: 14

  cuj:
    name: CUJ con BD real (Playwright + Supabase local)
    # F0: los 8 recorridos críticos contra Supabase
    # local levantado con TODAS las migraciones de supabase/migrations/ (de paso
    # comprueba que reproducen el esquema) y sembrado con scripts/seed-test.mjs.
    # Sin secretos: claves locales de `supabase start`. Sin red a proveedores:
    # TMDB con datos fijos (tests/e2e/a11y/offline-fetch.cjs). Nunca toca
    # producción ni kultura-test (env.cjs aborta si la URL no es local).
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      TEST_USER_EMAIL: seed-a@cuj.test
      TEST_USER_PASSWORD: Seed-Kultura-2026!
      TEST_USER_B_EMAIL: seed-b@cuj.test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.95.4

      - name: Supabase local (aplica las migraciones)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta

      - name: Claves locales al entorno
        run: |
          supabase status -o env | sed -E 's/^([A-Z_]+)="(.*)"$/\1=\2/' | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY|PUBLISHABLE_KEY|SECRET_KEY)=' >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Seed (scripts/seed-test.mjs contra Supabase local)
        run: |
          SUPABASE_TEST_URL="$API_URL" SUPABASE_TEST_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" node scripts/seed-test.mjs

      - name: Versión de Playwright
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Caché de navegadores de Playwright
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Navegador de Playwright (descarga)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Navegador de Playwright (desde la caché)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install chromium

      - name: Build contra Supabase local y sin red
        run: npm run test:cuj:build

      - name: Los 8 CUJ (+ b3_5e de Descubrir e idioma)
        run: npm run test:cuj

      - name: Informe de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cuj-report
          path: |
            playwright-report/cuj
            test-results/cuj
          retention-days: 14

      - name: Logs de Supabase local
        if: failure()
        run: docker ps -a && docker logs supabase_auth_kultura --tail 200 || true

  integration:
    name: Integración (RLS y base) contra el proyecto de test
    # Saneamiento, red de seguridad 3: en cada PR que toque migraciones o la
    # API, además de a mano y cada lunes. Una migración nueva se aplica en
    # kultura-test ANTES de abrir el PR (ver supabase/migrations/README.md).
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    # Una sola a la vez: todas usan la misma base de test y los mismos
    # usuarios fijos; dos a la vez chocaban (23505).
    concurrency:
      group: integration-test-db
      cancel-in-progress: false

    env:
      SUPABASE_TEST_URL: ${{ secrets.TEST_SUPABASE_URL }}
      SUPABASE_TEST_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
      SUPABASE_TEST_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ¿Toca migraciones o la API?
        id: secrets
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            if git diff --name-only "origin/$BASE_REF...HEAD" | grep -qE '^supabase/migrations/.+\.sql$|^src/app/api/'; then
              echo "El PR toca supabase/migrations/*.sql o src/app/api/**: se ejecuta."
            else
              echo "El PR no toca migraciones ni la API: no hace falta."
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          # Si tiene que correr y faltan los secretos, falla (no se salta).
          if [ -z "$SUPABASE_TEST_URL" ] || [ -z "$SUPABASE_TEST_ANON_KEY" ] || [ -z "$SUPABASE_TEST_SERVICE_ROLE_KEY" ]; then
            echo "::error::Faltan TEST_SUPABASE_URL / TEST_SUPABASE_ANON_KEY / TEST_SUPABASE_SERVICE_ROLE_KEY."
            exit 1
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.secrets.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: steps.secrets.outputs.run == 'true'
        run: npm ci

      - name: Usuarios fijos de los tests antiguos
        if: steps.secrets.outputs.run == 'true'
        run: node tests/integration/seed-test-users.mjs

      - name: Suite RLS (ataques, caminos felices, auditoría)
        if: steps.secrets.outputs.run == 'true'
        run: npx vitest run --config vitest.integration.config.ts tests/integration/rls

      - name: Resto de la integración
        if: steps.secrets.outputs.run == 'true'
        run: npx vitest run --config vitest.integration.config.ts tests/integration/db tests/integration/auth
